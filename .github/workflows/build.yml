name: Build and Push to ACR

on:
  workflow_run:
    workflows:
      - Security Scans
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGISTRY_URL: ${{ secrets.ACR_LOGIN_SERVER }}

jobs:
  build-and-push:
    name: Build Scan Push ${{ matrix.service }}
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - frontend
          - cartservice
          - productcatalogservice
          - currencyservice
          - paymentservice
          - shippingservice
          - emailservice
          - recommendationservice
          - adservice
          - checkoutservice
          - loadgenerator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure login
        uses: azure/login@v2

        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: login to ACR
        run: |
          az acr login \
            --name vrushacr777

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: src/${{ matrix.service }}
          file: docker/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: |
            ${{ matrix.service }}:scan

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.service }}:scan
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL

      - name: Tag Image
        run: |
          docker tag \
          ${{ matrix.service }}:scan \
          ${{ env.REGISTRY_URL }}/${{ matrix.service }}:latest

          docker tag \
          ${{ matrix.service }}:scan \
          ${{ env.REGISTRY_URL }}/${{ matrix.service }}:${{ github.sha }}

      - name: Push Latest Image
        run: |
          docker push \
          ${{ env.REGISTRY_URL }}/${{ matrix.service }}:latest

      - name: Push SHA Image
        run: |
          docker push \
          ${{ env.REGISTRY_URL }}/${{ matrix.service }}:${{ github.sha }}

      - name: Image Completed
        run: |
          echo "${{ matrix.service }} pushed successfully"

  redis-image:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          az acr login \
            --name vrushacr777

      - name: Pull Redis
        run: docker pull redis:7-alpine

      - name: Tag Redis
        run: |
          docker tag redis:7-alpine ${{ secrets.ACR_LOGIN_SERVER }}/redis-cart:7-alpine
          docker tag redis:7-alpine ${{ secrets.ACR_LOGIN_SERVER }}/redis-cart:latest

      - name: Push Redis
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/redis-cart:7-alpine
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/redis-cart:latest

  update-values:

    name: Update Helm Image Tag

    needs:
      - build-and-push
      - redis-image

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Helm Image Tag
        run: |
          sed -i "s/^  tag:.*/  tag: ${GITHUB_SHA}/" boutique-helm/boutique/values.yaml

      - name: Verify values.yaml
        run: |
          echo "Updated values.yaml"
          cat boutique-helm/boutique/values.yaml

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit Changes
        run: |
          git add boutique-helm/boutique/values.yaml

          git diff --cached --quiet || \
          git commit -m "Update image tag to ${GITHUB_SHA}"

      - name: Push Changes
        run: |
          git push origin main