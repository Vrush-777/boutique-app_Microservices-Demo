apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentservice
  namespace: {{ .Values.namespace }}
  labels:
    app: paymentservice

spec:
  replicas: {{ .Values.replicas.paymentservice }}

  selector:
    matchLabels:
      app: paymentservice

  template:
    metadata:
      labels:
        app: paymentservice

    spec:
      containers:
        - name: paymentservice

          image: "{{ .Values.image.registry }}/paymentservice:{{ .Values.image.tag }}"
          imagePullPolicy: Always

          ports:
            - containerPort: 50051

          env:
            - name: PORT
              value: "50051"

            - name: DISABLE_PROFILER
              value: "1"

          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 30
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: paymentservice
  namespace: {{ .Values.namespace }}
  labels:
    app: paymentservice

spec:
  type: ClusterIP

  selector:
    app: paymentservice

  ports:
    - port: 50051
      targetPort: 50051