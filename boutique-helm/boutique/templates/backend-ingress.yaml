apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: backend-ingress
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway

spec:
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080