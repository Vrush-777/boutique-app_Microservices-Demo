apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendationservice
  namespace: {{ .Values.namespace }}
  labels:
    app: recommendationservice

spec:
  replicas: {{ .Values.replicas.recommendationservice }}

  selector:
    matchLabels:
      app: recommendationservice

  template:
    metadata:
      labels:
        app: recommendationservice

    spec:
      containers:
        - name: recommendationservice

          image: "{{ .Values.image.registry }}/recommendationservice:{{ .Values.image.tag }}"
          imagePullPolicy: Always

          resources:
            requests:
                cpu: 100m
                memory: 128Mi
            limits:
                cpu: 500m
                memory: 512Mi

          ports:
            - containerPort: 8081

          env:
            - name: PORT
              value: "8081"

            - name: PRODUCT_CATALOG_SERVICE_ADDR
              value: "productcatalogservice:3550"

            - name: DISABLE_PROFILER
              value: "1"

          readinessProbe:
            grpc:
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            grpc:
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: recommendationservice
  namespace: {{ .Values.namespace }}
  labels:
    app: recommendationservice

spec:
  type: ClusterIP

  selector:
    app: recommendationservice

  ports:
    - port: 8081
      targetPort: 8081