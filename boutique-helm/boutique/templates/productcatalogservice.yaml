apiVersion: apps/v1
kind: Deployment
metadata:
  name: productcatalogservice
  namespace: {{ .Values.namespace }}
  labels:
    app: productcatalogservice

spec:
  replicas: {{ .Values.replicas.productcatalogservice }}

  selector:
    matchLabels:
      app: productcatalogservice

  template:
    metadata:
      labels:
        app: productcatalogservice

    spec:
      containers:
        - name: productcatalogservice

          image: "{{ .Values.image.registry }}/productcatalogservice:{{ .Values.image.tag }}"
          imagePullPolicy: Always

          ports:
            - containerPort: 3550

          env:
            - name: PORT
              value: "3550"

            - name: DISABLE_PROFILER
              value: "1"

          readinessProbe:
            grpc:
              port: 3550
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            grpc:
              port: 3550
            initialDelaySeconds: 30
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: productcatalogservice
  namespace: {{ .Values.namespace }}
  labels:
    app: productcatalogservice

spec:
  type: ClusterIP

  selector:
    app: productcatalogservice

  ports:
    - port: 3550
      targetPort: 3550