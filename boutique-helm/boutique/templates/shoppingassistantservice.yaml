{{- if .Values.shoppingassistantservice.enabled }}


apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoppingassistantservice
  namespace: {{ .Values.namespace }}
  labels:
    app: shoppingassistantservice

spec:
  replicas: {{ .Values.replicas.shoppingassistantservice }}

  selector:
    matchLabels:
      app: shoppingassistantservice

  template:
    metadata:
      labels:
        app: shoppingassistantservice

    spec:
      containers:
        - name: shoppingassistantservice

          image: "{{ .Values.image.registry }}/shoppingassistantservice:{{ .Values.image.tag }}"
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          env:
            - name: PORT
              value: "8080"

            - name: PROJECT_ID
              value: "boutique-poc"

            - name: REGION
              value: "centralindia"

            - name: PRODUCT_CATALOG_SERVICE_ADDR
              value: "productcatalogservice:3550"

            - name: DISABLE_PROFILER
              value: "1"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: shoppingassistantservice
  namespace: {{ .Values.namespace }}
  labels:
    app: shoppingassistantservice

spec:
  type: ClusterIP

  selector:
    app: shoppingassistantservice

  ports:
    - port: 8080
      targetPort: 8080

{{- end }}