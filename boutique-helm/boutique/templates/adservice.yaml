apiVersion: apps/v1
kind: Deployment
metadata:
  name: adservice
  namespace: {{ .Values.namespace }}
  labels:
    app: adservice

spec:
  replicas: {{ .Values.replicas.adservice }}

  selector:
    matchLabels:
      app: adservice

  template:
    metadata:
      labels:
        app: adservice

    spec:
      containers:
        - name: adservice

          image: "{{ .Values.image.registry }}/adservice:{{ .Values.image.tag }}"
          imagePullPolicy: Always

          resources:
            requests:
                cpu: 100m
                memory: 128Mi
            limits:
                cpu: 500m
                memory: 512Mi

          ports:
            - containerPort: 9555

          env:
            - name: PORT
              value: "9555"

            - name: DISABLE_PROFILER
              value: "1"

          readinessProbe:
            grpc:
              port: 9555
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            grpc:
              port: 9555
            initialDelaySeconds: 30
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: adservice
  namespace: {{ .Values.namespace }}
  labels:
    app: adservice

spec:
  type: ClusterIP

  selector:
    app: adservice

  ports:
    - port: 9555
      targetPort: 9555