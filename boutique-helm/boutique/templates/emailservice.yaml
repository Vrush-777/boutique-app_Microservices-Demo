apiVersion: apps/v1
kind: Deployment
metadata:
  name: emailservice
  namespace: {{ .Values.namespace }}
  labels:
    app: emailservice

spec:
  replicas: {{ .Values.replicas.emailservice }}

  selector:
    matchLabels:
      app: emailservice

  template:
    metadata:
      labels:
        app: emailservice

    spec:
      containers:
        - name: emailservice

          image: "{{ .Values.image.registry }}/emailservice:{{ .Values.image.tag }}"
          imagePullPolicy: Always

          resources:
            requests:
                cpu: 100m
                memory: 128Mi
            limits:
                cpu: 500m
                memory: 512Mi

          ports:
            - containerPort: 8080

          env:
            - name: PORT
              value: "8080"

            - name: DISABLE_PROFILER
              value: "1"

          readinessProbe:
            grpc:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            grpc:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: emailservice
  namespace: {{ .Values.namespace }}
  labels:
    app: emailservice

spec:
  type: ClusterIP

  selector:
    app: emailservice

  ports:
    - port: 8080
      targetPort: 8080