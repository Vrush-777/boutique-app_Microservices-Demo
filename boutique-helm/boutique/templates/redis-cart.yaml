apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cart
  namespace: {{ .Values.namespace }}
  labels:
    app: redis-cart

spec:
  replicas: {{ .Values.replicas.redisCart }}

  selector:
    matchLabels:
      app: redis-cart

  template:
    metadata:
      labels:
        app: redis-cart

    spec:
      containers:
        - name: redis-cart

          image: "{{ .Values.image.registry }}/redis-cart:{{ .Values.redis.tag }}"
          imagePullPolicy: Always

          ports:
            - containerPort: 6379

          resources:
            requests:
              cpu: 70m
              memory: 200Mi

            limits:
              cpu: 200m
              memory: 512Mi

          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10


---
apiVersion: v1
kind: Service
metadata:
  name: redis-cart
  namespace: {{ .Values.namespace }}
  labels:
    app: redis-cart

spec:
  type: ClusterIP

  selector:
    app: redis-cart

  ports:
    - port: 6379
      targetPort: 6379