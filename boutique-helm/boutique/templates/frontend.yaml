apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ .Values.namespace }}
  labels:
    app: frontend
spec:
  replicas: {{ .Values.replicas.frontend }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image.registry }}/frontend:{{ .Values.image.tag }}"
          imagePullPolicy: Always

          resources:
            requests:
                cpu: 100m
                memory: 128Mi
            limits:
                cpu: 500m
                memory: 512Mi

          ports:
            - containerPort: 8080

          env:
            - name: PORT
              value: "8080"

            - name: PRODUCT_CATALOG_SERVICE_ADDR
              value: "productcatalogservice:3550"

            - name: CURRENCY_SERVICE_ADDR
              value: "currencyservice:7000"

            - name: CART_SERVICE_ADDR
              value: "cartservice:7070"

            - name: RECOMMENDATION_SERVICE_ADDR
              value: "recommendationservice:8081"

            - name: SHIPPING_SERVICE_ADDR
              value: "shippingservice:50050"

            - name: CHECKOUT_SERVICE_ADDR
              value: "checkoutservice:5050"

            - name: AD_SERVICE_ADDR
              value: "adservice:9555"

            - name: SHOPPING_ASSISTANT_SERVICE_ADDR
              value: "shoppingassistantservice:8080"

            - name: DISABLE_PROFILER
              value: "1"

          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ .Values.namespace }}
  labels:
    app: frontend

spec:
  type: ClusterIP

  selector:
    app: frontend

  ports:
    - port: 80
      targetPort: 8080