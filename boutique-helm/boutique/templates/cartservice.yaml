apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartservice
  namespace: {{ .Values.namespace }}
  labels:
    app: cartservice

spec:
  replicas: {{ .Values.replicas.cartservice }}

  selector:
    matchLabels:
      app: cartservice

  template:
    metadata:
      labels:
        app: cartservice

    spec:
      containers:
        - name: cartservice

          image: "{{ .Values.image.registry }}/cartservice:{{ .Values.image.tag }}"
          imagePullPolicy: Always

          ports:
            - containerPort: 7070

          env:
            - name: PORT
              value: "7070"

            - name: REDIS_ADDR
              value: "redis-cart:6379"

            - name: DISABLE_PROFILER
              value: "1"

          readinessProbe:
            grpc:
              port: 7070
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            grpc:
              port: 7070
            initialDelaySeconds: 30
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: cartservice
  namespace: {{ .Values.namespace }}
  labels:
    app: cartservice

spec:
  type: ClusterIP

  selector:
    app: cartservice

  ports:
    - port: 7070
      targetPort: 7070