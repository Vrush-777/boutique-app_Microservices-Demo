apiVersion: apps/v1
kind: Deployment
metadata:
  name: shippingservice
  namespace: {{ .Values.namespace }}
  labels:
    app: shippingservice

spec:
  replicas: {{ .Values.replicas.shippingservice }}

  selector:
    matchLabels:
      app: shippingservice

  template:
    metadata:
      labels:
        app: shippingservice

    spec:
      containers:
        - name: shippingservice

          image: "{{ .Values.image.registry }}/shippingservice:{{ .Values.image.tag }}"
          imagePullPolicy: Always

          ports:
            - containerPort: 50050

          env:
            - name: PORT
              value: "50050"

            - name: DISABLE_PROFILER
              value: "1"

          readinessProbe:
            grpc:
              port: 50050
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            grpc:
              port: 50050
            initialDelaySeconds: 30
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: shippingservice
  namespace: {{ .Values.namespace }}
  labels:
    app: shippingservice

spec:
  type: ClusterIP

  selector:
    app: shippingservice

  ports:
    - port: 50050
      targetPort: 50050