apiVersion: apps/v1
kind: Deployment
metadata:
  name: currencyservice
  namespace: {{ .Values.namespace }}
  labels:
    app: currencyservice

spec:
  replicas: {{ .Values.replicas.currencyservice }}

  selector:
    matchLabels:
      app: currencyservice

  template:
    metadata:
      labels:
        app: currencyservice

    spec:
      containers:
        - name: currencyservice

          image: "{{ .Values.image.registry }}/currencyservice:{{ .Values.image.tag }}"
          imagePullPolicy: Always

          ports:
            - containerPort: 7000

          env:
            - name: PORT
              value: "7000"

            - name: DISABLE_PROFILER
              value: "1"

          readinessProbe:
            grpc:
              port: 7000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            grpc:
              port: 7000
            initialDelaySeconds: 30
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: currencyservice
  namespace: {{ .Values.namespace }}
  labels:
    app: currencyservice

spec:
  type: ClusterIP

  selector:
    app: currencyservice

  ports:
    - port: 7000
      targetPort: 7000