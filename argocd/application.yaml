apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: boutique
  namespace: argocd

spec:

  project: default
  source:
    repoURL: https://github.com/Vrush-777/boutique-app_Microservices-Demo.git
    targetRevision: main
    path: boutique-helm/boutique

  destination:
    server: https://kubernetes.default.svc
    namespace: boutique

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    retry:
     limit: 5
     backoff:
      duration: 10s
      factor: 2
      maxDuration: 3m

    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true
    - PruneLast=true