apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: boutique
  namespace: argocd

spec:

  project: default
  source:

    # Your GitHub repository
    repoURL: https://github.com/Vrush-777/boutique-app_Microservices-Demo
    # Branch
    targetRevision: main
    # Helm chart location
    path: boutique-helm/boutique

  destination:
    # Deploy into same AKS cluster
    server: https://kubernetes.default.svc
    # Application namespace
    namespace: boutique

  syncPolicy:
    automated:
      # Remove resources deleted from Git
      prune: true
      # Fix manual changes automatically
      selfHeal: true

    syncOptions:
    - CreateNamespace=true